name: Build and Lint

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout fc-shared
        uses: actions/checkout@v5
        with:
          repository: FigureCollecting/fc-shared
          path: fc-shared
          token: ${{ secrets.FC_SHARED_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build fc-shared dependency
        run: |
          cd fc-shared
          npm ci
          npm run build

      - name: Patch fc-shared dependency path
        run: |
          # Rewrite the local file: reference to point to checked-out fc-shared
          node -e "
            const pkg = require('./package.json');
            pkg.dependencies['@figurecollecting/fc-shared'] = 'file:./fc-shared';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx tsc -b --noEmit || true

      - name: Build application
        run: npm run build

      - name: Bundle size check
        run: |
          SIZE=$(du -sk dist/assets/*.js | awk '{sum+=$1} END {print sum}')
          echo "Total JS bundle: ${SIZE}KB"
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js | while read size file; do
            echo "| $(basename $file) | $size |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total JS: ${SIZE}KB**" >> $GITHUB_STEP_SUMMARY
          if [ "$SIZE" -gt 500 ]; then
            echo "Warning: Bundle exceeds 500KB threshold" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
