name: Build and Lint

on:
  push:
    branches: ['**']  # every branch; the job-level gate below decides what runs
  pull_request:
    branches: [develop, main]

# ---------------------------------------------------------------------------
# CI policy: "fork shift-left" (see README, "CI on forks (shift-left)").
# Developers work on forks and open PRs to FigureCollecting/*. Every push
# event is gated per entry job by ONE expression (pull_request, schedule and
# workflow_dispatch behave exactly as before). The four push cases:
#   owner == FigureCollecting, ref develop|main -> RUN  (upstream integration branches, unchanged)
#   owner == FigureCollecting, any other ref    -> SKIP (upstream feature branches get CI via their PR)
#   owner != FigureCollecting, ref develop|main -> SKIP (fork develop/main are mirrors of upstream: run nothing)
#   owner != FigureCollecting, any other ref    -> RUN  (shift-left: CI on fork feature branches)
# Jobs that `needs:` a gated entry job skip cleanly (never fail) when it skips.
# Note: expression `==` is case-insensitive (GitHub has no case-sensitive
# compare), so a branch named e.g. `Develop` counts as a mirror; nothing here
# publishes, so at worst a CI run is skipped or runs on an oddly named branch.
# Install/build steps authenticate with secrets.NODE_AUTH_TOKEN (fork-held PAT,
# read:packages only) and fall back to GITHUB_TOKEN on the org; publishing
# (GHCR push, npm publish, releases) is org-only.
# ---------------------------------------------------------------------------

jobs:
  build:
    name: Build Application (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Push gate: the single CI-policy expression (four cases documented above).
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run linter
        run: npx tsc -b --noEmit

      - name: Run unit tests
        run: npx vitest run --coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        # chromium, plus the sign-off shot projects (full Fold8 panels and desktop).
        run: npx playwright test --project=chromium --project='*-full' --project=desktop

      - name: Build application
        run: npm run build

      - name: Bundle size check
        run: |
          SIZE=$(du -sk dist/assets/*.js | awk '{sum+=$1} END {print sum}')
          echo "Total JS bundle: ${SIZE}KB"
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js | while read size file; do
            echo "| $(basename $file) | $size |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total JS: ${SIZE}KB**" >> $GITHUB_STEP_SUMMARY
          if [ "$SIZE" -gt 500 ]; then
            echo "Warning: Bundle exceeds 500KB threshold" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-node${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  # Branch protection requires a check literally named "Build Application";
  # the matrix legs are named per-version, so aggregate their result here.
  # Carries the SAME push gate as `build` above, so this job is SKIPPED (not a
  # false SUCCESS) on the same pushes where the matrix itself doesn't run.
  build-application:
    name: Build Application
    runs-on: ubuntu-latest
    needs: build
    if: >-
      always() && (
        github.event_name != 'push'
        || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
        || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
      )
    steps:
      - name: Require all matrix legs green
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build matrix result: ${{ needs.build.result }}"
            exit 1
          fi
