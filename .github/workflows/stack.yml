name: Local stack harness

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

# Same fork shift-left push gate as build.yml. The harness has its own
# package (e2e/stack) so its dependencies never touch the app's lockfile.
jobs:
  stack:
    name: Stack harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/stack/package-lock.json

      - name: Install app dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install harness dependencies
        run: npm --prefix e2e/stack ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      # Installs the coordinator's packages up front, so the steps after it run without the token.
      - name: Fetch and install the pinned coordinator
        run: npm --prefix e2e/stack run checkout
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      # After the token steps: nothing that runs repo code comes before a step holding the token.
      - name: Build the app
        run: npm run build

      - name: Typecheck the harness
        run: npm --prefix e2e/stack run typecheck

      - name: Harness tests with coverage (includes the full-stack acceptance)
        run: npm --prefix e2e/stack run test:coverage

      - name: One command up, probe, down
        run: |
          set -euo pipefail
          npm run stack:up -- --detach
          api=$(curl -s -o /dev/null -w '%{http_code}' -D headers.txt http://localhost:8480/api/x)
          grep -qi '^dpop-nonce:' headers.txt
          root=$(curl -s -o root.html -w '%{http_code}' http://localhost:8480/)
          grep -q '<title>FigureCollecting</title>' root.html
          echo "/api/x -> ${api} (DPoP-Nonce present), / -> ${root}"
          test "${api}" = 401 && test "${root}" = 200
          npm run stack:down

      # WK-08: the OIDC build (.env.stack) against the mock issuer and the real coordinator.
      - name: Build the app for the stack's auth suite
        run: npm run build:stack

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Auth and sync e2e on the stack (mobile-chromium; sync at the Fold8 sizes, Chromium and WebKit)
        run: npm run test:e2e:stack

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-logs
          path: |
            e2e/stack/.state/
            test-results/
          retention-days: 7
