name: Local stack harness

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

# Same fork shift-left push gate as build.yml. The harness has its own
# package (e2e/stack) so its dependencies never touch the app's lockfile.
jobs:
  stack:
    name: Stack harness
    runs-on: ubuntu-latest
    # 55 left no room when the runner's apt mirror made the browser install take 29-33 min (11-18); the install step has its own 30 min cap
    timeout-minutes: 80
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/stack/package-lock.json

      - name: Install app dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install harness dependencies
        run: npm --prefix e2e/stack ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      # Installs the coordinator's packages up front, so the steps after it run without the token.
      - name: Fetch and install the pinned coordinator
        run: npm --prefix e2e/stack run checkout
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      # After the token steps: nothing that runs repo code comes before a step holding the token.
      - name: Build the app
        run: npm run build

      - name: Typecheck the harness
        run: npm --prefix e2e/stack run typecheck

      - name: Harness tests with coverage (includes the full-stack acceptance)
        run: npm --prefix e2e/stack run test:coverage

      - name: One command up, probe, down
        run: |
          set -euo pipefail
          npm run stack:up -- --detach
          api=$(curl -s -o /dev/null -w '%{http_code}' -D headers.txt http://localhost:8480/api/x)
          grep -qi '^dpop-nonce:' headers.txt
          root=$(curl -s -o root.html -w '%{http_code}' http://localhost:8480/)
          grep -q '<title>FigureCollecting</title>' root.html
          echo "/api/x -> ${api} (DPoP-Nonce present), / -> ${root}"
          test "${api}" = 401 && test "${root}" = 200
          npm run stack:down

      # WK-08: the OIDC build (.env.stack) against the mock issuer and the real coordinator.
      - name: Build the app for the stack's auth suite
        run: npm run build:stack

      - name: Read the Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "codename=$(lsb_release -cs)" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Cache the system packages' .deb files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ steps.pw.outputs.codename }}

      # The runner's apt mirror served ~180 WebKit debs at ~7 s each; with the debs cached, apt downloads nothing.
      - name: Install Playwright Chromium and WebKit
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/apt-debs"
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs >/dev/null
          sudo cp -n "$HOME"/.cache/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          npx playwright install-deps chromium webkit
          sudo cp -n /var/cache/apt/archives/*.deb "$HOME/.cache/apt-debs/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-debs"
          npx playwright install chromium webkit

      - name: Auth and sync e2e on the stack (mobile-chromium; sync at the Fold8 sizes, Chromium and WebKit)
        run: npm run test:e2e:stack

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: stack-logs
          path: |
            e2e/stack/.state/
            test-results/
          retention-days: 7
