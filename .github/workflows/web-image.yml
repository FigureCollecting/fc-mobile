name: Web image

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

# `image` builds fc-mobile-web from this tree and runs the PWA acceptance
# (playwright.pwa.config.ts) against it behind the local stack; it only ever
# reads packages. `publish` pushes ghcr.io/figurecollecting/fc-mobile-web:sha-<short>
# on org pushes to develop/main and is the only job with packages: write.
# Push gate: the same fork shift-left expression as build.yml.
jobs:
  image:
    name: Web image and PWA acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    permissions:
      contents: read
      packages: read
    # NODE_AUTH_TOKEN is set per step on the install and build steps only, so
    # the scan and test steps (third-party actions included) run without it.
    env:
      FC_WEB_IMAGE: fc-mobile-web:ci
      FC_WEB_IMAGE_NEXT: fc-mobile-web:ci-next
      FC_STACK_WEB_IMAGE: fc-mobile-web:ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/stack/package-lock.json

      - name: Install app dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install harness dependencies and the pinned coordinator
        run: |
          npm --prefix e2e/stack ci
          npm --prefix e2e/stack run checkout
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build image N and N+1
        # N+1 differs only in its build id: enough for a new sw.js, which is
        # what the update test needs.
        run: |
          set -euo pipefail
          sha="sha-${GITHUB_SHA::7}"
          for pair in "${FC_WEB_IMAGE}=${sha}" "${FC_WEB_IMAGE_NEXT}=${sha}-next"; do
            DOCKER_BUILDKIT=1 docker build \
              --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
              --build-arg "VITE_BUILD_ID=${pair#*=}" \
              -t "${pair%%=*}" .
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify the image runs as a non-root user
        run: |
          user=$(docker inspect "${FC_WEB_IMAGE}" --format '{{.Config.User}}')
          echo "image user: ${user}"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::fc-mobile-web runs as root"
            exit 1
          fi

      - name: Verify the image bundle signs in through OIDC only
        # Authentik is the only sign-in (WK-15); the legacy client never loads at boot.
        run: |
          set -euo pipefail
          cid=$(docker create "${FC_WEB_IMAGE}")
          docker cp "${cid}:/usr/share/nginx/html" "${RUNNER_TEMP}/html"
          docker rm "${cid}" >/dev/null
          sh scripts/assert-bundle-auth.sh "${RUNNER_TEMP}/html"

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        # publish needs this job, so a finding here stops the push.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, full-SHA pin (GHSA-69fq-xp46-6x23)
        with:
          image-ref: ${{ env.FC_WEB_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: PWA acceptance against the image
        run: npx playwright test -c playwright.pwa.config.ts

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-image-logs
          path: |
            e2e/stack/.state/
            test-results/
          retention-days: 7

  publish:
    name: Publish fc-mobile-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: image
    if: >-
      github.event_name == 'push'
      && github.repository_owner == 'FigureCollecting'
      && (github.ref_name == 'develop' || github.ref_name == 'main')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/figurecollecting/fc-mobile-web
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BUILD_ID=${{ steps.meta.outputs.version }}
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify the PUBLISHED image runs as a non-root user
        # A second build from the one `image` tested: assert on the pushed bytes.
        run: |
          set -euo pipefail
          ref="ghcr.io/figurecollecting/fc-mobile-web@${{ steps.publish.outputs.digest }}"
          docker pull --quiet "${ref}"
          user=$(docker inspect "${ref}" --format '{{.Config.User}}')
          echo "published image user: ${user}"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::the published fc-mobile-web image runs as root"
            exit 1
          fi

      - name: Verify the PUBLISHED image bundle signs in through OIDC only
        run: |
          set -euo pipefail
          ref="ghcr.io/figurecollecting/fc-mobile-web@${{ steps.publish.outputs.digest }}"
          cid=$(docker create "${ref}")
          docker cp "${cid}:/usr/share/nginx/html" "${RUNNER_TEMP}/published-html"
          docker rm "${cid}" >/dev/null
          sh scripts/assert-bundle-auth.sh "${RUNNER_TEMP}/published-html"

      - name: Report the digest
        run: |
          {
            echo "### fc-mobile-web published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.publish.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
