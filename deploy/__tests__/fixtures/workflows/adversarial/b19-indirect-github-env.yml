# B19: an earlier step writes $GITHUB_ENV without spelling it (bash indirect expansion).
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: n=GITHUB_E""NV; echo "NODE_OPTIONS=--require $PWD/x.js" >> "${!n}"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
