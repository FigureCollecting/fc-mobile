# B20: an earlier action exports NODE_OPTIONS for the token step (core.exportVariable).
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: core.exportVariable('NODE_OPTIONS', '--require ./x.js')
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
