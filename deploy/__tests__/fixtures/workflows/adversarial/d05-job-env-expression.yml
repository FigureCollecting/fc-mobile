# D5: the job env of a token job is one expression, so it can set NODE_OPTIONS unseen.
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env: ${{ fromJSON('{"NODE_OPTIONS":"--require=/tmp/x.js"}') }}
    steps:
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
