# D6: the workflow env around a token job is one expression, so it can set NODE_OPTIONS unseen.
on: push
env: ${{ fromJSON('{"NODE_OPTIONS":"--require=/tmp/x.js"}') }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
