# D1 (wk-09b-i2): a plain install entry runs the repo's checkout script; only the coordinator entries may.
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix e2e/stack run checkout
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
