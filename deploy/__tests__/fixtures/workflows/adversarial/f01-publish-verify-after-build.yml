# wk-09c-i2b: the publish job as it was at 94c590a. The build action's post stage runs after
# every later step of its job, with NODE_AUTH_TOKEN still in its env, so a later step can put
# an env value or a PATH entry in front of a process that holds the token.
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/figurecollecting/fc-mobile-web
          tags: |
            type=sha,format=short,prefix=sha-
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BUILD_ID=${{ steps.meta.outputs.version }}
          secret-envs: |
            node_auth_token=NODE_AUTH_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Verify the PUBLISHED image runs as a non-root user
        run: |
          set -euo pipefail
          ref="ghcr.io/figurecollecting/fc-mobile-web@${{ steps.publish.outputs.digest }}"
          docker pull --quiet "${ref}"
          user=$(docker inspect "${ref}" --format '{{.Config.User}}')
          echo "published image user: ${user}"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::the published fc-mobile-web image runs as root"
            exit 1
          fi
      - name: Verify the PUBLISHED image bundle signs in through OIDC only
        run: |
          set -euo pipefail
          ref="ghcr.io/figurecollecting/fc-mobile-web@${{ steps.publish.outputs.digest }}"
          cid=$(docker create "${ref}")
          docker cp "${cid}:/usr/share/nginx/html" "${RUNNER_TEMP}/published-html"
          docker rm "${cid}" >/dev/null
          sh scripts/assert-bundle-auth.sh "${RUNNER_TEMP}/published-html"
      - name: Report the digest
        run: |
          {
            echo "### fc-mobile-web published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.publish.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
