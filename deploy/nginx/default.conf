# fc-mobile-web: the built PWA on nginx-unprivileged (:8080, uid 101, read-only
# root; only /tmp is written). Headers are set once at server level and no
# location adds its own, because any add_header in a location drops these.

# The SPA fallback answers navigations only. A fetch for a missing file must
# 404, or a stale client caches index.html as a script or an image.
map $http_accept $fc_accepts_html {
    "~*text/html" 1;
    default       0;
}
map $http_sec_fetch_mode $fc_navigation {
    navigate 1;
    # Browsers without Fetch Metadata: a navigation asks for text/html.
    ""       $fc_accepts_html;
    default  0;
}

# Hashed build output never changes under its name; everything else (the
# shell, sw.js, the manifest, icons) must be revalidated on every load.
map $uri $fc_cache_control {
    "~^/assets/" "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://images.figurecollecting.com; font-src 'self'; connect-src 'self' https://auth.mindsignals1.com; manifest-src 'self'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Success responses only: a 404 for a not-yet-deployed asset must not be cached for a year.
    add_header Cache-Control $fc_cache_control;

    # R-1(b): HOLDING=1 at container start writes one rewrite here (docker-entrypoint.d/40-fc-holding.sh);
    # HOLDING=0 writes nothing and the glob matches no file, which nginx accepts.
    include /tmp/fc-mode/*.conf;

    # The edge routes ^/api(/.*)?$ to the coordinator; if one lands here it is a 404, never the shell.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }

    location ~ /\. { return 404; }

    location = / { try_files /index.html =404; }

    location = /manifest.webmanifest { default_type application/manifest+json; }

    location / {
        try_files $uri @spa;
    }

    location @spa {
        if ($fc_navigation = 0) { return 404; }
        try_files /index.html =404;
    }
}
