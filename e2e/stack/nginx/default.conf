# Stand-in SPA server for the local stack until WK-09 ships the real
# fc-mobile-web config and image (FC_STACK_WEB_IMAGE then replaces this).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The edge never routes /api here; if it arrives anyway it is a 404, never the app shell.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { try_files $uri /index.html; }
}
