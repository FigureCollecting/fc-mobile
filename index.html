<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="23x32" href="./src/assets/brand/favicon-ears-32.png" />
    <link rel="icon" type="image/png" sizes="11x16" href="./src/assets/brand/favicon-ears-16.png" />
    <link rel="apple-touch-icon" sizes="34x48" href="./src/assets/brand/favicon-ears-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0967d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>FigureCollecting</title>
    <style>
      /* Inline splash: visible before JS hydrates, hidden after */
      .pre-splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        transition: opacity 400ms ease-out;
      }
      .pre-splash--hidden { opacity: 0; pointer-events: none; }
      .pre-splash__text {
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-size: 1.375rem;
        font-weight: 700;
        color: #f0f0f0;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="pre-splash" class="pre-splash">
      <span class="pre-splash__text">FigureCollecting</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fade out pre-splash once the app module has loaded
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var el = document.getElementById('pre-splash');
          if (el) {
            el.classList.add('pre-splash--hidden');
            setTimeout(function() { el.remove(); }, 500);
          }
        }, 200);
      });
    </script>
  </body>
</html>
